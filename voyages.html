<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Destination</th>
            <th>Prix</th>
            <th>Date Départ</th>
            <th>Actions</th>
          </tr>
        </thead>
        @for (voyage of voyages; track voyage.idVoyage) {
          <tbody>
            <tr>
              <td>{{voyage.idVoyage}}</td>
              <td>{{voyage.destination}}</td>
              <td>{{voyage.prixVoyage}}</td>
              <td>{{voyage.dateDepart | date: 'dd/MM/yyyy'}}</td>
              <td>
                <a class="btn btn-danger mx-1" (click)="supprimerVoyage(voyage)">Supprimer</a>
                <a class="btn btn-success" [routerLink]="['/updateVoyage', voyage.idVoyage]">Modifier</a>
              </td>
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
